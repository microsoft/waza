name: Squad Insider Release
# go project — configure build, test, and insider release commands below

on:
  push:
    branches: [insider]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Download Dependencies
        run: go mod download

      - name: Setup Node.js (for web UI build)
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci && npm run build

      - name: Ensure web/dist exists
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            echo '<!doctype html><html><head><title>waza</title></head><body>placeholder</body></html>' > web/dist/index.html
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Execute Tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Insider Release Binary
        run: |
          go build -v -o waza ./cmd/waza
          ./waza --version

      - name: Integration Test
        run: |
          set +e
          ./waza run ./examples/code-explainer/eval.yaml --verbose
          EXIT_CODE=$?
          if [ $EXIT_CODE -gt 1 ]; then
            echo "::error::waza crashed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "Insider release integration test passed (exit code: $EXIT_CODE)"

      - name: Create Insider Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(git describe --tags --always)-insider
          gh release create "$VERSION" ./waza \
            --title "Insider Release $VERSION" \
            --notes "Pre-release build of waza CLI for insider testing" \
            --prerelease 2>/dev/null || echo "Insider release already exists or creation failed"
