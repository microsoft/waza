name: Go Build and Test

on:
  push:
    branches: [ main, develop, dev, insider ]
  pull_request:
  # Inactive until workflow_dispatch is independently enabled on the default branch.
  workflow_dispatch:
    inputs:
      cold_observation:
        description: Observe initially empty isolated Linux dependency stores
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-scope:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-completeness-plan.yml

  native-test-shards:
    uses: ./.github/workflows/go-native-shards.yml
    with:
      cold_observation: ${{ github.event_name == 'workflow_dispatch' && inputs.cold_observation }}
      pr_completeness: ${{ github.event_name == 'pull_request' }}

  build-and-test:
    name: Linux build and remaining tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI_EVIDENCE_COLD_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.cold_observation }}
      CI_EVIDENCE_COLD_SETUP_CACHE_DISABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.cold_observation }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    defaults:
      run:
        working-directory: ./
        shell: bash  # Forces Git Bash on Windows, standard Bash on Linux

    steps: &go-build-test-steps
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 2

      - name: Record receipt checkout
        if: github.event_name == 'pull_request'
        id: checkout
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Go Environment
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: ${{ env.CI_EVIDENCE_COLD_REQUESTED != 'true' }}
          cache-dependency-path: go.sum

      - name: Setup Node.js (web build and offline assertion oracle)
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: ${{ env.CI_EVIDENCE_COLD_REQUESTED != 'true' && 'npm' || '' }}
          package-manager-cache: ${{ env.CI_EVIDENCE_COLD_REQUESTED != 'true' }}
          cache-dependency-path: web/package-lock.json

      - name: Observe initially empty isolated stores
        if: env.CI_EVIDENCE_COLD_REQUESTED == 'true'
        run: node .github/scripts/ci-evidence-cache.cjs prepare go-npm web

      - name: Verify Module Dependencies
        id: verify_modules
        run: go mod verify

      - name: Download Dependencies
        id: download
        run: go mod download

      - name: Install and prove rejecting runtime guard
        id: guard
        run: bash .github/scripts/go_offline_env.sh >> "$GITHUB_ENV"

      - name: Verify uncached compatibility inventory
        id: inventory
        if: matrix.os == 'ubuntu-latest'
        run: make test-compat-inventory

      # Only build full Web UI on Linux to save time/resources on Windows
      - name: Build Web UI
        id: web_build
        if: matrix.os == 'ubuntu-latest' && hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci && npm run build

      # Bash syntax works on Windows runners too
      - name: Ensure web/dist exists (stub for go:embed)
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            echo '<!doctype html><html><head><title>waza</title></head><body>placeholder</body></html>' > web/dist/index.html
            echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">w</text></svg>' > web/dist/favicon.svg
          fi

      - name: Format Check
        id: format
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files must be formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        id: vet
        run: go vet ./...

      - name: Execute Tests
        id: ci_tests
        env:
          GO_CACHE_HIT: ${{ steps.go.outputs.cache-hit }}
          NODE_CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            bash .github/scripts/ci_go_test_capture.sh remaining coverage.txt
          else
            bash .github/scripts/ci_go_test_capture.sh all coverage.txt
          fi

      - name: Test native Windows shell controls
        id: shell_controls
        if: matrix.os == 'windows-latest'
        run: |
          log="$(mktemp)"
          go test -count=1 -v -timeout=5m -run '^Test(CompletenessGoLintShellExecution|OrdinaryShellOverridesAndDisabledPaths)$' ./.github/scripts | sed 's/\r$//' | tee "$log"
          if grep -q -- '--- SKIP:' "$log"; then
            echo "Native Windows shell controls must not skip." >&2
            exit 1
          fi
          for control in TestCompletenessGoLintShellExecution TestOrdinaryShellOverridesAndDisabledPaths; do
            grep -Fxq "=== RUN   $control" "$log"
            grep -Eq "^--- PASS: $control \([0-9.]+s\)$" "$log"
          done
          rm "$log"

      - name: Test native Windows release dashboard checker
        if: matrix.os == 'windows-latest'
        run: |
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          go test -v -race -count=1 -timeout=5m ./.github/scripts/release-dashboard-check | sed 's/\r$//' | tee "$log"
          if grep -q -- '--- SKIP:' "$log"; then
            echo "Native Windows release dashboard tests must not skip." >&2
            exit 1
          fi
          for control in TestReadFileOpensOrdinaryWindowsFile TestReadFileRejectsWindowsLeafReparseReplacement TestReadFileRetainsOpenedWindowsParentDuringReplacement; do
            grep -Fxq "=== RUN   $control" "$log"
            grep -Eq "^--- PASS: $control \([0-9.]+s\)$" "$log"
          done

      - name: Reject tolerated runtime launches
        id: no_launch
        run: |
          if [ -e "$COPILOT_CLI_PATH.invoked" ]; then
            echo "Ordinary Go tests attempted to launch the Copilot runtime." >&2
            exit 1
          fi

      - name: Retain sanitized Go execution evidence
        if: always() && steps.ci_tests.outcome != 'skipped' && steps.ci_tests.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-go-run-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: coverage.txt.evidence.json
          retention-days: 14
          if-no-files-found: warn

      - name: Retain remaining-package coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-main
          path: coverage.txt
          if-no-files-found: error

      - name: Build Binary
        id: binary
        run: |
          BINARY_NAME="waza"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BINARY_NAME="waza.exe"
          fi

          go build -v -o $BINARY_NAME ./cmd/waza

          # Verify binary
          chmod +x ./$BINARY_NAME
          ./$BINARY_NAME --version

      - name: Integration Test
        id: integration
        run: |
          BINARY_NAME=waza
          if [ "$RUNNER_OS" = Windows ]; then
            BINARY_NAME=waza.exe
          fi
          bash .github/scripts/release_integration_test.sh "./$BINARY_NAME"

      - name: Capture PR completeness receipt
        if: always() && github.event_name == 'pull_request'
        id: receipt
        env:
          WAZA_COMPLETENESS_STEPS: ${{ toJSON(steps) }}
        run: |
          receipt_dir="$RUNNER_TEMP/pr-completeness-receipt-${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}"
          mkdir -p "$receipt_dir"
          printf '%s' "$WAZA_COMPLETENESS_STEPS" > "$receipt_dir/steps.json"
          node .github/scripts/pr-completeness.cjs plan > "$receipt_dir/plan.json"
          node .github/scripts/pr-completeness.cjs receipt \
            "$receipt_dir/plan.json" go "${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}" \
            "$receipt_dir/steps.json" > "$receipt_dir/receipt.json"
          node - "$receipt_dir/receipt.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`artifact_name=${receipt.artifact_name}\n`);
          NODE

      - name: Upload PR completeness receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/pr-completeness-receipt-${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}/receipt.json
          if-no-files-found: error

  build-and-test-windows:
    name: ${{ matrix.os }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      matrix:
        os: [windows-latest]
    defaults:
      run:
        working-directory: ./
        shell: bash
    steps: *go-build-test-steps

  linux-gate:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    needs: [build-and-test, native-test-shards]
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - name: Require every build and native test shard
        id: requirements
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          NATIVE_RESULT: ${{ needs.native-test-shards.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Record receipt checkout
        if: github.event_name == 'pull_request'
        id: checkout
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Node for PR completeness receipt
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Download all required coverage and discovery evidence
        id: coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-coverage-*
          merge-multiple: true
          path: coverage-reports
      - name: Verify exhaustive native test selection and coverage
        id: inventory
        run: bash .github/scripts/go_test_shard_verify.sh coverage-reports
      - name: Upload combined coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage-reports/coverage.txt,coverage-reports/coverage-native-0.txt,coverage-reports/coverage-native-1.txt,coverage-reports/coverage-native-2.txt,coverage-reports/coverage-native-3.txt
          disable_search: true
          flags: go-implementation
          name: waza
      - name: Capture PR completeness receipt
        if: always() && github.event_name == 'pull_request'
        id: receipt
        env:
          WAZA_COMPLETENESS_STEPS: ${{ toJSON(steps) }}
        run: |
          receipt_dir="$RUNNER_TEMP/pr-completeness-receipt-linux-gate"
          mkdir -p "$receipt_dir"
          printf '%s' "$WAZA_COMPLETENESS_STEPS" > "$receipt_dir/steps.json"
          node .github/scripts/pr-completeness.cjs plan > "$receipt_dir/plan.json"
          node .github/scripts/pr-completeness.cjs receipt \
            "$receipt_dir/plan.json" go "linux-gate" \
            "$receipt_dir/steps.json" > "$receipt_dir/receipt.json"
          node - "$receipt_dir/receipt.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`artifact_name=${receipt.artifact_name}\n`);
          NODE
      - name: Upload PR completeness receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/pr-completeness-receipt-linux-gate/receipt.json
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 2

      - name: Record receipt checkout
        if: github.event_name == 'pull_request'
        id: checkout
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node for PR completeness receipt
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      # Required because golangci-lint might try to compile code that uses embed
      - name: Ensure web/dist exists (stub for go:embed)
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            echo '<!doctype html><html><head><title>waza</title></head><body>placeholder</body></html>' > web/dist/index.html
            echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">w</text></svg>' > web/dist/favicon.svg
          fi

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          working-directory: ./
          install-only: true

      - name: Test lint script failure handling
        id: lint_controls
        run: bash .github/scripts/lint_test.sh

      - name: Test Go workflow trigger selection
        id: workflow_controls
        run: go test -count=1 -v ./.github/scripts ./.github/scripts/publish-runner-reference-guard ./.github/scripts/verify-runner-reference-guard ./.github/scripts/release-assets-helper

      - name: Verify configuration and run golangci-lint
        id: lint
        run: bash .github/scripts/lint.sh

      - name: Capture PR completeness receipt
        if: always() && github.event_name == 'pull_request'
        id: receipt
        env:
          WAZA_COMPLETENESS_STEPS: ${{ toJSON(steps) }}
        run: |
          receipt_dir="$RUNNER_TEMP/pr-completeness-receipt-lint"
          mkdir -p "$receipt_dir"
          printf '%s' "$WAZA_COMPLETENESS_STEPS" > "$receipt_dir/steps.json"
          node .github/scripts/pr-completeness.cjs plan > "$receipt_dir/plan.json"
          node .github/scripts/pr-completeness.cjs receipt \
            "$receipt_dir/plan.json" go "lint" \
            "$receipt_dir/steps.json" > "$receipt_dir/receipt.json"
          node - "$receipt_dir/receipt.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`artifact_name=${receipt.artifact_name}\n`);
          NODE

      - name: Upload PR completeness receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/pr-completeness-receipt-lint/receipt.json
          if-no-files-found: error

  dashboard:
    needs: [pr-scope]
    if: needs.pr-scope.outputs.dashboard == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/web-ci.yml
    with:
      pr_completeness_plan: ${{ needs.pr-scope.outputs.plan_artifact }}

  documentation:
    needs: [pr-scope]
    if: needs.pr-scope.outputs.site == 'true' || needs.pr-scope.outputs.examples == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/site-ci.yml
    with:
      pr_completeness_plan: ${{ needs.pr-scope.outputs.plan_artifact }}
      site: ${{ needs.pr-scope.outputs.site == 'true' }}
      examples: ${{ needs.pr-scope.outputs.examples == 'true' }}

  assurance:
    needs: [pr-scope]
    if: needs.pr-scope.outputs.assurance == 'true'
    uses: ./.github/workflows/grader-assurance-ci.yml
    with:
      pr_completeness_plan: ${{ needs.pr-scope.outputs.plan_artifact }}

  container:
    needs: [pr-scope]
    if: needs.pr-scope.outputs.container == 'true'
    # Reusable-workflow validation needs the caller to cover nested job
    # permissions, including the PR-only cache measurement job.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/docker-ci.yml
    with:
      pr_completeness_plan: ${{ needs.pr-scope.outputs.plan_artifact }}

  tools:
    needs: [pr-scope]
    if: needs.pr-scope.outputs.tools == 'true'
    uses: ./.github/workflows/squad-tools-ci.yml
    with:
      pr_completeness_plan: ${{ needs.pr-scope.outputs.plan_artifact }}

  runtime:
    needs: [pr-scope]
    if: needs.pr-scope.outputs.runtime == 'true'
    uses: ./.github/workflows/evidence-judge-ci.yml
    with:
      pr_completeness_plan: ${{ needs.pr-scope.outputs.plan_artifact }}

  completeness:
    needs: [pr-scope, lint, build-and-test, build-and-test-windows, native-test-shards, linux-gate,
      dashboard, documentation, assurance, container, tools, runtime]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-completeness-admission.yml
    with:
      pr_completeness_plan: ${{ needs.pr-scope.outputs.plan_artifact }}
      dependency_results: ${{ toJSON(needs) }}
