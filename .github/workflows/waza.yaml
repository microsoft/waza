name: Skill Eval

on:
  workflow_call:
    inputs:
      eval-path:
        description: 'Path to eval.yaml file'
        required: true
        type: string
      fail-threshold:
        description: 'Minimum success rate threshold (0-1)'
        required: false
        type: number
        default: 0.8
      trials:
        description: 'Override trials per task'
        required: false
        type: number
      output-format:
        description: 'CLI display format (default or github-comment)'
        required: false
        type: string
        default: 'default'
      waza-version:
        description: 'Exact published standalone Waza version'
        required: false
        type: string
        default: '0.41.0'
    outputs:
      pass-rate:
        description: 'Overall success rate (legacy output name)'
        value: ${{ jobs.eval.outputs.pass_rate }}
      composite-score:
        description: 'Aggregate score (legacy output name)'
        value: ${{ jobs.eval.outputs.composite_score }}
      status:
        description: 'Eval status (success/failure)'
        value: ${{ jobs.eval.outputs.status }}

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pass_rate: ${{ steps.validate.outputs.success_rate }}
      composite_score: ${{ steps.validate.outputs.aggregate_score }}
      status: ${{ steps.validate.outputs.status }}
    
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install exact published Waza binary
        env:
          WAZA_VERSION: ${{ inputs.waza-version }}
        run: |
          if [[ ! "$WAZA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::waza-version must be an exact numeric release such as 0.41.0"
            exit 1
          fi
          curl -fsSL \
            "https://raw.githubusercontent.com/microsoft/waza/v${WAZA_VERSION}/.github/scripts/install-waza-release.sh" \
            -o "$RUNNER_TEMP/install-waza-release.sh"
          bash "$RUNNER_TEMP/install-waza-release.sh" "$WAZA_VERSION"

      - name: Verify Waza binary
        run: waza --version
      
      - name: Run Evaluation
        id: run-eval
        env:
          EVAL_PATH: ${{ inputs.eval-path }}
          OUTPUT_FORMAT: ${{ inputs.output-format }}
          TRIALS: ${{ inputs.trials }}
        run: |
          rm -f -- results.json
          command=(waza run "$EVAL_PATH" --output results.json --format "$OUTPUT_FORMAT")
          case "$TRIALS" in
            ''|0) ;;
            *[!0-9]*)
              echo "::error::trials must be a non-negative integer"
              exit 1
              ;;
            *) command+=(--trials "$TRIALS") ;;
          esac
          set +e
          "${command[@]}"
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
      
      - name: Validate result artifact and generate summary
        id: validate
        if: always()
        env:
          MIN_SUCCESS_RATE: ${{ inputs.fail-threshold }}
          RUN_EXIT_CODE: ${{ steps.run-eval.outputs.exit_code }}
          WAZA_VERSION: ${{ inputs.waza-version }}
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/microsoft/waza/v${WAZA_VERSION}/.github/scripts/validate-waza-result.sh" \
            -o "$RUNNER_TEMP/validate-waza-result.sh"
          bash "$RUNNER_TEMP/validate-waza-result.sh" results.json "$MIN_SUCCESS_RATE" "$RUN_EXIT_CODE"
      
      - name: Upload Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: results.json
          if-no-files-found: error

      - name: Enforce evaluation status
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          EVALUATION_STATUS: ${{ steps.validate.outputs.status }}
        run: |
          if [ "$VALIDATION_OUTCOME" != "success" ] || [ "$EVALUATION_STATUS" != "success" ]; then
            exit 1
          fi
