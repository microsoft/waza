name: PR completeness admission

on:
  workflow_call:
    inputs:
      pr_completeness_plan:
        type: string
        required: true
      dependency_results:
        type: string
        required: true

permissions:
  # Checkout and the fresh PR API snapshot only; unspecified scopes are none.
  # Reusable workflows cannot raise the caller's permission ceiling.
  contents: read
  pull-requests: read

jobs:
  admission:
    name: PR completeness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested merge and both parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download exact plan from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.pr_completeness_plan }}
          path: ${{ runner.temp }}/pr-completeness-plan
      - name: Download individual receipts from this attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pr-completeness-receipt-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: false
          path: ${{ runner.temp }}/pr-completeness-receipts
      - name: Admit current source and all applicable evidence
        id: admit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WAZA_COMPLETENESS_PLAN: ${{ inputs.pr_completeness_plan }}
          WAZA_COMPLETENESS_NEEDS: ${{ inputs.dependency_results }}
        run: |
          node .github/scripts/pr-completeness-admission.cjs admit \
            "$RUNNER_TEMP/pr-completeness-plan" "$RUNNER_TEMP/pr-completeness-receipts" \
            "$RUNNER_TEMP/pr-completeness-result"
      - name: Retain admission result including rejected evidence
        if: always() && steps.admit.outcome != 'skipped' && steps.admit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-completeness-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-completeness-result/result.json
          if-no-files-found: error
