name: Squad Tools CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      pr_completeness_plan:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  triage-regressions:
    name: Squad tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            unit: linux
          - os: windows-latest
            unit: windows
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Download PR completeness plan
        if: inputs.pr_completeness_plan != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.pr_completeness_plan }}
          path: ${{ runner.temp }}/pr-completeness-plan

      - name: Record receipt checkout
        if: inputs.pr_completeness_plan != ''
        id: checkout
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Fetch pinned SDK reader without installing or running package scripts
        id: integrity
        run: |
          mkdir -p .git/squad-sdk-package
          npm pack @bradygaster/squad-sdk@1.0.0 --ignore-scripts --registry=https://registry.npmjs.org --pack-destination .git/squad-sdk-package --silent
          node -e "const fs=require('node:fs'); const crypto=require('node:crypto'); const bytes=fs.readFileSync('.git/squad-sdk-package/bradygaster-squad-sdk-1.0.0.tgz'); const actual=crypto.createHash('sha512').update(bytes).digest('base64'); if(actual!=='9f4NthJaQDq6ifXU3f6VfsZz2bbWs2u57fHhXKtDgDMSvZ3Xq8FPjMvddxhRvseWqaSlkYcWsag3M/lzTtKaJA==') throw Error('Squad SDK integrity mismatch');"
          tar -xzf .git/squad-sdk-package/bradygaster-squad-sdk-1.0.0.tgz -C .git/squad-sdk-package

      - name: Test triage and casting checkout with the real pinned SDK reader
        id: tests
        env:
          SQUAD_SDK_READER: .git/squad-sdk-package/package/dist/casting/durable-registry.js
        run: node --test .github/scripts/ralph-triage.test.cjs .github/scripts/squad-state.test.cjs .github/scripts/squad-casting.test.cjs .github/scripts/squad-triage.test.cjs .github/scripts/squad-governance.test.cjs .github/scripts/squad-worktree.test.cjs

      - name: Capture PR completeness receipt
        if: always() && inputs.pr_completeness_plan != ''
        id: receipt
        env:
          WAZA_COMPLETENESS_STEPS: ${{ toJSON(steps) }}
        run: |
          receipt_dir="$RUNNER_TEMP/pr-completeness-receipt-${{ matrix.unit }}"
          mkdir -p "$receipt_dir"
          printf '%s' "$WAZA_COMPLETENESS_STEPS" > "$receipt_dir/steps.json"
          node .github/scripts/pr-completeness.cjs receipt \
            "$RUNNER_TEMP/pr-completeness-plan/plan.json" tools "${{ matrix.unit }}" \
            "$receipt_dir/steps.json" > "$receipt_dir/receipt.json"
          node - "$receipt_dir/receipt.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`artifact_name=${receipt.artifact_name}\n`);
          NODE

      - name: Upload PR completeness receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/pr-completeness-receipt-${{ matrix.unit }}/receipt.json
          if-no-files-found: error
