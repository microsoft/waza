name: Site Build

# PR-time validation for the Starlight docs site (site/).
#
# This workflow always runs on pull requests targeting main so it can be
# used as a required status check without deadlocking non-site PRs. A
# path-filter step detects whether site files actually changed; if not,
# the expensive build is skipped and the job reports success. The Pages
# deploy workflow (.github/workflows/pages.yml) still handles the actual
# deploy on push to main.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'registry.json'
      - 'cmd/waza/**'
      - 'internal/**'
      - 'schemas/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'web/**'
      - '.github/workflows/site-ci.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect site changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            site:
              - 'site/**'
              - 'docs/**'
              - 'README.md'
              - 'registry.json'
              - 'internal/models/outcome.go'
              - 'schemas/**'
              - '.github/workflows/site-ci.yml'
              - '.github/workflows/pages.yml'
            examples:
              - 'site/**'
              - 'docs/**'
              - 'README.md'
              - 'registry.json'
              - 'cmd/waza/**'
              - 'internal/**'
              - 'schemas/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'web/**'
              - '.github/workflows/site-ci.yml'

      - name: Setup Node
        if: steps.filter.outputs.site == 'true' || github.event_name == 'push'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npm ci

      - name: Build site
        if: steps.filter.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npm run build

      - name: Typecheck chat and test public metadata
        if: steps.filter.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npm run test:chat-types && npm run test:chat-metadata && npm run test:chat-contract

      - name: Install Chromium for site regression tests
        if: steps.filter.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npx --no-install playwright install --with-deps chromium

      - name: Test site
        id: tests
        if: steps.filter.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npm run test:e2e -- --project=chromium --retries=0
        env:
          CI: 'true'

      - name: Test optional chat with mocked service and bot protection
        if: steps.filter.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npm run test:private-chat && npm run test:chat -- --project=chromium --retries=0 && npm run test:chat-unavailable -- --project=chromium --retries=0
        env:
          CI: 'true'

      - name: Upload site test evidence
        if: always() && steps.tests.outcome != 'skipped' && steps.tests.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-chromium-${{ github.run_id }}
          path: |
            site/test-results/
            docs/images/site-*.png
          if-no-files-found: error

      - name: Skip (no site changes)
        if: steps.filter.outputs.site != 'true' && github.event_name == 'pull_request'
        run: echo "No site/** changes detected — skipping site build."

  examples:
    name: Offline documentation examples
    needs: build
    if: needs.build.outputs.examples == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      NO_COLOR: '1'
      GOMAXPROCS: '2'
      WAZA_NO_UPDATE_CHECK: '1'
      ENABLE_COPILOT_TESTS: 'false'
      ENABLE_COPILOT_SDK_TESTS: 'false'
      ENABLE_LIVE_COPILOT_TESTS: 'false'
      COPILOT_CLI_PATH: ${{ github.workspace }}
    steps:
      - name: Checkout source and embedded runtime assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build current CLI with genuine dashboard assets
        run: make build

      - name: Run extracted examples and fail-closed isolation regressions
        run: WAZA_BIN="$GITHUB_WORKSPACE/waza" npm --prefix site run test:examples
