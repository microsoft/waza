name: Site Build

# PR-time validation for the Starlight docs site (site/).
#
# This workflow always runs on pull requests targeting main so it can be
# used as a required status check without deadlocking non-site PRs. A
# path-filter step detects whether documentation or its guard inputs changed; if not,
# the expensive build is skipped and the job reports success. The Pages
# deploy workflow (.github/workflows/pages.yml) still handles the actual
# deploy on push to main.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'examples/interop/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'version.txt'
      - 'registry.json'
      - 'cmd/waza/**'
      - 'internal/**'
      - 'schemas/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'web/**'
      - '.github/workflows/site-ci.yml'
      - '.github/workflows/web-ci.yml'
      - '.github/workflows/docker-ci.yml'
      - '.github/workflows/publish-runner-reference.yml'
      - '.github/workflows/verify-runner-reference.yml'
      - '.github/workflows/pages.yml'
  workflow_call:
    inputs:
      pr_completeness_plan:
        type: string
        required: false
        default: ''
      site:
        description: Plan-selected site applicability; receipt capture re-verifies it
        type: boolean
        required: false
        default: false
      examples:
        description: Plan-selected examples applicability; receipt capture re-verifies it
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: site-ci-${{ github.ref }}${{ inputs.pr_completeness_plan != '' && '-completeness' || '' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect site and example changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.scope.outputs.site || steps.filter.outputs.site }}
      examples: ${{ steps.scope.outputs.examples || steps.filter.outputs.examples }}
    steps:
      - name: Checkout
        if: inputs.pr_completeness_plan == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use completeness plan scope
        id: scope
        if: inputs.pr_completeness_plan != ''
        env:
          SITE_SELECTED: ${{ inputs.site }}
          EXAMPLES_SELECTED: ${{ inputs.examples }}
        run: printf 'site=%s\nexamples=%s\n' "$SITE_SELECTED" "$EXAMPLES_SELECTED" >> "$GITHUB_OUTPUT"

      - name: Detect site changes
        id: filter
        if: inputs.pr_completeness_plan == ''
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            site:
              - 'site/**'
              - 'docs/**'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'version.txt'
              - 'registry.json'
              - 'go.mod'
              - 'cmd/waza/cmd_serve.go'
              - 'internal/embedded/**'
              - 'internal/models/outcome.go'
              - 'internal/models/schema_version.go'
              - 'internal/runneridentity/testdata/**'
              - 'internal/runnerunit/testdata/**'
              - 'internal/runnerterminal/testdata/**'
              - 'schemas/**'
              - 'web/package.json'
              - 'web/playwright.config.ts'
              - 'web/e2e/screenshots.spec.ts'
              - 'web/e2e/release-screenshots.spec.ts'
              - 'web/e2e/runner-negotiation.spec.ts'
              - '.github/workflows/site-ci.yml'
              - '.github/workflows/web-ci.yml'
              - '.github/workflows/docker-ci.yml'
              - '.github/workflows/publish-runner-reference.yml'
              - '.github/workflows/verify-runner-reference.yml'
              - '.github/workflows/pages.yml'
            examples:
              - 'site/**'
              - 'docs/**'
              - 'examples/interop/**'
              - 'README.md'
              - 'registry.json'
              - 'cmd/waza/**'
              - 'internal/**'
              - 'schemas/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'web/**'
              - '.github/workflows/site-ci.yml'

  build:
    name: Build site
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful change detection
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Download PR completeness plan
        if: inputs.pr_completeness_plan != '' && needs.changes.outputs.site == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.pr_completeness_plan }}
          path: ${{ runner.temp }}/pr-completeness-plan

      - name: Record receipt checkout
        if: inputs.pr_completeness_plan != '' && needs.changes.outputs.site == 'true'
        id: checkout
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        id: node
        if: needs.changes.outputs.site == 'true' || github.event_name == 'push'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        id: install
        if: needs.changes.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npm ci

      - name: Build site
        id: build
        if: needs.changes.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npm run build

      - name: Typecheck chat and test public metadata
        id: metadata
        if: needs.changes.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npm run test:chat-types && npm run test:chat-metadata && npm run test:chat-contract

      - name: Install Chromium for site regression tests
        id: chromium
        if: needs.changes.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npx --no-install playwright install --with-deps chromium

      - name: Test site
        id: tests
        if: needs.changes.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npm run test:e2e -- --project=chromium --retries=0 --reporter=github,line,json --output=test-results/site
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/site-report.json

      - name: Test optional chat with mocked service and bot protection
        id: chat-tests
        if: needs.changes.outputs.site == 'true' || github.event_name == 'push'
        run: cd site && npm run test:private-chat && PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/chat-report.json npm run test:chat -- --project=chromium --retries=0 --reporter=github,line,json --output=test-results/chat && PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/chat-unavailable-report.json npm run test:chat-unavailable -- --project=chromium --retries=0 --reporter=github,line,json --output=test-results/chat-unavailable
        env:
          CI: 'true'

      - name: Upload site test evidence
        if: always() && (steps.tests.outcome != 'skipped' && steps.tests.outcome != '' || steps.chat-tests.outcome != 'skipped' && steps.chat-tests.outcome != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-chromium-${{ github.run_id }}
          path: site/test-results/
          if-no-files-found: error

      - name: Capture PR completeness receipt
        if: always() && inputs.pr_completeness_plan != '' && needs.changes.outputs.site == 'true'
        id: receipt
        env:
          WAZA_COMPLETENESS_STEPS: ${{ toJSON(steps) }}
        run: |
          receipt_dir="$RUNNER_TEMP/pr-completeness-receipt"
          mkdir -p "$receipt_dir"
          printf '%s' "$WAZA_COMPLETENESS_STEPS" > "$receipt_dir/steps.json"
          node - "$receipt_dir/browser.json" <<'NODE'
          const fs = require('node:fs');
          const read = (name) => JSON.parse(fs.readFileSync(`site/test-results/${name}`, 'utf8'));
          fs.writeFileSync(process.argv[2], JSON.stringify({
            browser: read('site-report.json'),
            chat: read('chat-report.json'),
            chat_unavailable: read('chat-unavailable-report.json'),
          }));
          NODE
          node .github/scripts/pr-completeness.cjs receipt \
            "$RUNNER_TEMP/pr-completeness-plan/plan.json" site site \
            "$receipt_dir/steps.json" "$receipt_dir/browser.json" > "$receipt_dir/receipt.json"
          node - "$receipt_dir/receipt.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`artifact_name=${receipt.artifact_name}\n`);
          NODE

      - name: Upload PR completeness receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/pr-completeness-receipt/receipt.json
          if-no-files-found: error

      - name: Skip (no site changes)
        if: needs.changes.outputs.site != 'true' && github.event_name == 'pull_request'
        run: echo "No site/** changes detected — skipping site build."

  examples:
    name: Offline documentation examples
    needs: [changes]
    if: needs.changes.outputs.examples == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      NO_COLOR: '1'
      GOMAXPROCS: '2'
      WAZA_NO_UPDATE_CHECK: '1'
      ENABLE_COPILOT_TESTS: 'false'
      ENABLE_COPILOT_SDK_TESTS: 'false'
      ENABLE_LIVE_COPILOT_TESTS: 'false'
      COPILOT_CLI_PATH: ${{ github.workspace }}
    steps:
      - name: Checkout source and embedded runtime assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 2

      - name: Download PR completeness plan
        if: inputs.pr_completeness_plan != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.pr_completeness_plan }}
          path: ${{ runner.temp }}/pr-completeness-plan

      - name: Record receipt checkout
        if: inputs.pr_completeness_plan != ''
        id: checkout
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build current CLI with genuine dashboard assets
        id: build
        run: make build

      - name: Run extracted examples and fail-closed isolation regressions
        id: examples
        run: WAZA_BIN="$GITHUB_WORKSPACE/waza" npm --prefix site run test:examples

      - name: Capture PR completeness receipt
        if: always() && inputs.pr_completeness_plan != ''
        id: receipt
        env:
          WAZA_COMPLETENESS_STEPS: ${{ toJSON(steps) }}
        run: |
          receipt_dir="$RUNNER_TEMP/pr-completeness-receipt"
          mkdir -p "$receipt_dir"
          printf '%s' "$WAZA_COMPLETENESS_STEPS" > "$receipt_dir/steps.json"
          node .github/scripts/pr-completeness.cjs receipt \
            "$RUNNER_TEMP/pr-completeness-plan/plan.json" examples examples \
            "$receipt_dir/steps.json" > "$receipt_dir/receipt.json"
          node - "$receipt_dir/receipt.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`artifact_name=${receipt.artifact_name}\n`);
          NODE

      - name: Upload PR completeness receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/pr-completeness-receipt/receipt.json
          if-no-files-found: error
