name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'schemas/**'
      - 'internal/runneridentity/testdata/**'
      - 'internal/runnerunit/testdata/**'
      - 'internal/runnerterminal/testdata/**'
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: Build
    timeout-minutes: 20
    outputs:
      publication_ready: ${{ steps.publication.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release publication before deploying Pages
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version in version.txt: $version" >&2
            exit 1
          fi

          tag_sha="$(git ls-remote origin "refs/tags/v${version}" "refs/tags/v${version}^{}" |
            awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { print peeled != "" ? peeled : direct }')"
          if [[ -z "$tag_sha" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Pages deploy: v${version} is not tagged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          successful_release="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?head_sha=${tag_sha}&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length > 0')"
          if [[ "$successful_release" != "true" ]]; then
            runs_url="repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs"
            failed_runs="$(gh api --paginate "$runs_url?head_sha=${tag_sha}&event=push&branch=v${version}&status=failure&per_page=100" |
              jq -r --arg sha "$tag_sha" --arg tag "v${version}" '
                .workflow_runs[] |
                select(.head_sha == $sha and .head_branch == $tag and .event == "push"
                  and .status == "completed" and .conclusion == "failure") |
                [.id, .run_attempt] | @tsv')"
            fallback_run=""
            while IFS=$'\t' read -r run_id attempt; do
              [[ -n "$run_id" ]] || continue
              [[ "$run_id" =~ ^[0-9]+$ && "$attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
              matching_jobs="$(gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${attempt}/jobs?per_page=100" |
                jq '
                  (map(.jobs[])) as $jobs |
                  ([.[] | .total_count] | unique) == [($jobs | length)] and
                  all($jobs[]; .conclusion == "success" or .conclusion == "skipped" or .conclusion == "failure") and
                  all(("Setup Version",
                    "Shared candidate and release qualification / Run exact-source release validation / Complete exact-source release validation",
                    "Shared candidate and release qualification / Build, attest, verify and package qualification evidence",
                    "Publish qualified release runner image / Publish Linux AMD64 release image",
                    "Release CLI"); . as $name |
                    [$jobs[] | select(.name == $name) | .conclusion] == ["success"]) and
                  all($jobs[] | select(.conclusion == "skipped"); .name == "Native package smoke") and
                  ([$jobs[] | select(.conclusion == "failure")] |
                    length == 1 and .[0].name == "Release Extension" and
                    (.[0].steps |
                      all(.[]; .conclusion == "success" or .conclusion == "skipped" or .conclusion == "failure") and
                      ([.[] | select(.conclusion == "failure") | .name] == ["Create Release PR"]) and
                      ([.[] | select(.name == "Publish Extension") | .conclusion] == ["success"]) and
                      ([.[] | select(.name == "Publish Extension Provenance") | .conclusion] == ["success"])))')"
              if [[ "$matching_jobs" == "true" ]]; then
                fallback_run="$run_id"
                break
              fi
            done <<< "$failed_runs"

            published_release="false"
            if [[ -n "$fallback_run" ]]; then
              published_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${version}" |
                jq --arg tag "v${version}" \
                  '.tag_name == $tag and .draft == false and any(.assets[]; .name == "checksums.txt")')"
            fi
            if [[ "$published_release" != "true" ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Skipping Pages deploy: no successful Release run or verified publication fallback for v${version}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Pages publication fallback used for v${version}: Release run ${fallback_run} failed only at Create Release PR." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: cd site && npm ci

      - name: Build site
        run: cd site && npm run build
        env:
          PUBLIC_CHAT_API_URL: ${{ vars.PUBLIC_CHAT_API_URL }}
          PUBLIC_CHAT_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_CHAT_TURNSTILE_SITEKEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.publication_ready == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
