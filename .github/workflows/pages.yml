name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'schemas/**'
      - 'internal/runneridentity/testdata/**'
      - 'internal/runnerunit/testdata/**'
      - 'internal/runnerterminal/testdata/**'
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: Build
    timeout-minutes: 20
    outputs:
      publication_ready: ${{ steps.publication.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release publication before deploying Pages
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version in version.txt: $version" >&2
            exit 1
          fi

          tag_sha="$(git ls-remote origin "refs/tags/v${version}" "refs/tags/v${version}^{}" |
            awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { print peeled != "" ? peeled : direct }')"
          if [[ -z "$tag_sha" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Pages deploy: v${version} is not tagged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          successful_release="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?head_sha=${tag_sha}&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length > 0')"
          if [[ "$successful_release" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Pages deploy: no successful Release run for v${version}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: cd site && npm ci

      - name: Build site
        run: cd site && npm run build
        env:
          PUBLIC_CHAT_API_URL: ${{ vars.PUBLIC_CHAT_API_URL }}
          PUBLIC_CHAT_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_CHAT_TURNSTILE_SITEKEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.publication_ready == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
