name: Offline Grader Assurance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      pr_completeness_plan:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  producer-reader:
    name: Verify offline producer and frozen readers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_COPILOT_TESTS: 'false'
      NO_COLOR: '1'
    steps:
      - name: Checkout source and immutable reader snapshots
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 2

      - name: Download PR completeness plan
        if: inputs.pr_completeness_plan != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.pr_completeness_plan }}
          path: ${{ runner.temp }}/pr-completeness-plan

      - name: Record receipt checkout
        if: inputs.pr_completeness_plan != ''
        id: checkout
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        id: build
        working-directory: web
        run: npm ci && npm run build && npm run lint

      - name: Verify frozen reader custody and clean-checkout regression
        id: custody
        run: NODE_PATH="$PWD/web/node_modules" node --test scripts/frozen-assurance-reader.test.cjs

      - name: Install and prove rejecting runtime guard
        id: guard
        shell: bash
        run: |
          guard="$RUNNER_TEMP/offline-copilot"
          printf '#!/bin/sh\nprintf "offline assurance gate: native runtime disabled\\n" >&2\nexit 64\n' > "$guard"
          chmod +x "$guard"
          set +e
          "$guard" --version
          result=$?
          set -e
          test "$result" -eq 64
          echo "COPILOT_CLI_PATH=$guard" >> "$GITHUB_ENV"
          echo "WAZA_CALIBRATION_REPORT_DIR=$GITHUB_WORKSPACE/.cache/assurance-reports" >> "$GITHUB_ENV"
          echo "WAZA_PRESERVED_REPORT_DIR=$GITHUB_WORKSPACE/.cache/preserved-reports" >> "$GITHUB_ENV"

      - name: Verify private engine-free qualification controls
        id: qualification
        run: go test ./internal/assurance -run '^TestQualification' -count=1 -timeout=180s

      - name: Export actual deterministic API reports
        id: export
        run: go test ./internal/assurance -run '^TestCalibrateExportActualOfflineReports$' -count=1 -timeout=120s

      - name: Export actual preserved-native mechanical reports
        id: preserved_export
        run: go test ./internal/assurance -run '^TestVerifyPreservedActual(NativeResultsAndExport|CleanupFailureRetainsNativeResult)$' -count=1 -timeout=120s

      - name: Verify injected CLI consent and native deny-all controls
        id: consent
        run: |
          go test ./cmd/waza -run 'Test(Assure|AssuranceDocument|CalibrationAtomic)' -count=1 -timeout=120s
          go test ./internal/execution -run 'TestCopilotNewSessionDenyAllWithoutCallbacks|TestCopilotResumeToolPolicy' -count=1 -timeout=120s

      - name: Verify exact frozen offline reader
        id: reader
        shell: bash
        run: |
          NODE_PATH="$PWD/web/node_modules" WAZA_FROZEN_READER_DIR="$RUNNER_TEMP/frozen-assurance-reader" \
            node scripts/verify-frozen-assurance-reader.cjs \
            "$WAZA_CALIBRATION_REPORT_DIR/positive-calibrated-1.1.json" \
            "$WAZA_CALIBRATION_REPORT_DIR/operational-failure-calibrated-1.1.json" \
            "$WAZA_CALIBRATION_REPORT_DIR/verify-control-1.0.json"

      - name: Install Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify exact frozen readers reject the separate native profile
        id: preserved_reader
        shell: bash
        run: |
          NODE_PATH="$PWD/web/node_modules" WAZA_FROZEN_PRESERVED_READER_DIR="$RUNNER_TEMP/frozen-preserved-readers" \
            node scripts/verify-frozen-preserved-readers.cjs \
            "$WAZA_PRESERVED_REPORT_DIR/positive.json" \
            "$WAZA_PRESERVED_REPORT_DIR/nonpass.json" \
            "$WAZA_CALIBRATION_REPORT_DIR/verify-control-1.0.json" \
            "$WAZA_CALIBRATION_REPORT_DIR/positive-calibrated-1.1.json"
          NODE_PATH="$PWD/web/node_modules" WAZA_FROZEN_PRESERVED_READER_DIR="$RUNNER_TEMP/frozen-preserved-cleanup-readers" \
            node scripts/verify-frozen-preserved-readers.cjs \
            "$WAZA_PRESERVED_REPORT_DIR/positive.json" \
            "$WAZA_PRESERVED_REPORT_DIR/cleanup-failure.json" \
            "$WAZA_CALIBRATION_REPORT_DIR/verify-control-1.0.json" \
            "$WAZA_CALIBRATION_REPORT_DIR/positive-calibrated-1.1.json"

      - name: Verify actual API reports in explicit inspector
        id: browser
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/assurance-report.json
        run: npx --no-install playwright test e2e/assurance.spec.ts --project=chromium --retries=0 --reporter=github,line,json

      - name: Capture PR completeness receipt
        if: always() && inputs.pr_completeness_plan != ''
        id: receipt
        shell: bash
        env:
          WAZA_COMPLETENESS_STEPS: ${{ toJSON(steps) }}
        run: |
          receipt_dir="$RUNNER_TEMP/pr-completeness-receipt"
          mkdir -p "$receipt_dir"
          printf '%s' "$WAZA_COMPLETENESS_STEPS" > "$receipt_dir/steps.json"
          node - "$receipt_dir/browser.json" <<'NODE'
          const fs = require('node:fs');
          const browser = JSON.parse(fs.readFileSync('web/test-results/assurance-report.json', 'utf8'));
          fs.writeFileSync(process.argv[2], JSON.stringify({ browser }));
          NODE
          node .github/scripts/pr-completeness.cjs receipt \
            "$RUNNER_TEMP/pr-completeness-plan/plan.json" assurance assurance \
            "$receipt_dir/steps.json" "$receipt_dir/browser.json" > "$receipt_dir/receipt.json"
          node - "$receipt_dir/receipt.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`artifact_name=${receipt.artifact_name}\n`);
          NODE

      - name: Upload PR completeness receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/pr-completeness-receipt/receipt.json
          if-no-files-found: error
