name: Squad CI
# go project — configure build/test commands below

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, insider]

permissions:
  contents: read

jobs:
  native-test-shards:
    uses: ./.github/workflows/go-native-shards.yml

  build-and-test:
    name: Linux build and remaining tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    defaults:
      run:
        working-directory: ./
        shell: bash

    steps: &go-build-test-steps
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Download Dependencies
        run: go mod download

      - name: Setup Node.js (for web UI build)
        if: matrix.os == 'ubuntu-latest' && hashFiles('web/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        if: matrix.os == 'ubuntu-latest' && hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci && npm run build

      - name: Ensure web/dist exists (stub for go:embed)
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            echo '<!doctype html><html><head><title>waza</title></head><body>placeholder</body></html>' > web/dist/index.html
            echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">w</text></svg>' > web/dist/favicon.svg
          fi

      - name: Format Check
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files must be formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Execute Tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            packages="$(go list ./...)"
            selected=()
            while IFS= read -r package; do
              if [ "$package" != github.com/microsoft/waza/internal/controlledcomparison ]; then
                selected+=("$package")
              fi
            done <<< "$packages"
            go test -v -race -timeout=30m -coverprofile=coverage.txt -covermode=atomic "${selected[@]}"
          else
            go test -v -race -timeout=30m -coverprofile=coverage.txt -covermode=atomic ./...
          fi

      - name: Retain remaining-package coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-main
          path: coverage.txt
          if-no-files-found: error

      - name: Build Binary
        run: |
          BINARY_NAME="waza"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BINARY_NAME="waza.exe"
          fi

          go build -v -o $BINARY_NAME ./cmd/waza

          # Verify binary
          chmod +x ./$BINARY_NAME
          ./$BINARY_NAME --version

      - name: Integration Test
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Verify waza can load and execute an eval end-to-end with the
          # mock executor. Exit code 1 = eval tasks failed (expected with
          # mock output). Exit code >1 or signal = real crash — fail CI.
          set +e
          ./waza run ./examples/code-explainer/eval.yaml --verbose
          EXIT_CODE=$?
          if [ $EXIT_CODE -gt 1 ]; then
            echo "::error::waza crashed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "Integration test completed (exit code: $EXIT_CODE)"

  build-and-test-windows:
    name: ${{ matrix.os }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      matrix:
        os: [windows-latest]
    defaults:
      run:
        working-directory: ./
        shell: bash
    steps: *go-build-test-steps

  linux-gate:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    needs: [build-and-test, native-test-shards]
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - name: Require every build and native test shard
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          NATIVE_RESULT: ${{ needs.native-test-shards.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all required coverage and discovery evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-coverage-*
          merge-multiple: true
          path: coverage-reports
      - name: Verify exhaustive native test selection and coverage
        run: bash .github/scripts/go_test_shard_verify.sh coverage-reports
      - name: Upload combined coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage-reports/coverage.txt,coverage-reports/coverage-native-0.txt,coverage-reports/coverage-native-1.txt,coverage-reports/coverage-native-2.txt,coverage-reports/coverage-native-3.txt
          disable_search: true
          flags: go-implementation
          name: waza

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Ensure web/dist exists (stub for go:embed)
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            echo '<!doctype html><html><head><title>waza</title></head><body>placeholder</body></html>' > web/dist/index.html
            echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">w</text></svg>' > web/dist/favicon.svg
          fi

      - name: Install Golangci-Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          working-directory: ./
          install-only: true

      - name: Test lint script failure handling
        run: bash .github/scripts/lint_test.sh

      - name: Test Go workflow trigger selection
        run: go test -count=1 ./.github/scripts

      - name: Verify configuration and run golangci-lint
        run: bash .github/scripts/lint.sh
