name: Dashboard Build and Test

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      ENABLE_COPILOT_TESTS: 'false'
      ENABLE_LIVE_COPILOT_TESTS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect dashboard changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/web-ci.yml'

      - name: Setup Node
        if: steps.filter.outputs.web == 'true' || github.event_name != 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.web == 'true' || github.event_name != 'pull_request'
        working-directory: web
        run: npm ci

      - name: Lint dashboard
        if: steps.filter.outputs.web == 'true' || github.event_name != 'pull_request'
        working-directory: web
        run: npm run lint

      - name: Build dashboard
        if: steps.filter.outputs.web == 'true' || github.event_name != 'pull_request'
        working-directory: web
        run: npm run build

      - name: Install Chromium
        if: steps.filter.outputs.web == 'true' || github.event_name != 'pull_request'
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Test dashboard
        id: tests
        if: steps.filter.outputs.web == 'true' || github.event_name != 'pull_request'
        working-directory: web
        run: npx --no-install playwright test --project=chromium --retries=0

      - name: Upload dashboard test evidence
        if: always() && steps.tests.outcome != 'skipped' && steps.tests.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-chromium-${{ github.run_id }}
          path: |
            web/test-results/
            web/dist/
            docs/images/
            site/public/images/explore/
          if-no-files-found: error

      - name: Skip (no dashboard changes)
        if: steps.filter.outputs.web != 'true' && github.event_name == 'pull_request'
        run: echo "No web/** changes detected - skipping dashboard validation."
