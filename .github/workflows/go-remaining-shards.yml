name: Linux Remaining Go Test Shards

on:
  workflow_call:
    inputs:
      cold_observation:
        description: Observe initially empty isolated Linux dependency stores
        type: boolean
        default: false
        required: false
      pr_completeness:
        description: Capture same-run PR completeness receipts
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  remaining:
    name: Linux remaining tests shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_EVIDENCE_COLD_REQUESTED: ${{ inputs.cold_observation }}
      CI_EVIDENCE_COLD_SETUP_CACHE_DISABLED: ${{ inputs.cold_observation }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 2
      - name: Record receipt checkout
        if: inputs.pr_completeness
        id: checkout
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Go Environment
        id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache: ${{ !inputs.cold_observation }}
          cache-dependency-path: go.sum
      - name: Setup Node for sanitized execution evidence
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: ${{ !inputs.cold_observation && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
          package-manager-cache: ${{ !inputs.cold_observation }}
      - name: Observe initially empty isolated stores
        if: inputs.cold_observation
        run: node .github/scripts/ci-evidence-cache.cjs prepare go-npm web
      - name: Verify Module Dependencies
        id: verify_modules
        run: go mod verify
      - name: Download Dependencies
        id: download
        run: go mod download
      - name: Install and prove rejecting runtime guard
        id: guard
        run: bash .github/scripts/go_offline_env.sh >> "$GITHUB_ENV"
      - name: Install web dependencies for the complete Go package inventory
        id: web_dependencies
        working-directory: web
        run: npm ci
      - name: Ensure web/dist exists (stub for go:embed)
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            echo '<!doctype html><html><head><title>waza</title></head><body>placeholder</body></html>' > web/dist/index.html
            echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">w</text></svg>' > web/dist/favicon.svg
          fi
      - name: Test remaining-shard planning and verification
        id: discovery_controls
        env:
          CI_EVIDENCE_COLD_REQUESTED: "false"
        run: bash .github/scripts/go_remaining_shard_test.sh
      - name: Execute exhaustive remaining-package test shard
        id: remaining_tests
        env:
          SHARD: ${{ matrix.shard }}
          WAZA_REMAINING_SHARD: ${{ matrix.shard }}
          GO_CACHE_HIT: ${{ steps.go.outputs.cache-hit }}
          NODE_CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
        run: |
          bash .github/scripts/go_remaining_test_shard.sh "$SHARD" "coverage-remaining-$SHARD.txt"
          if [ -e "$COPILOT_CLI_PATH.invoked" ]; then
            echo "Remaining test shard attempted to launch the Copilot runtime." >&2
            exit 1
          fi
      - name: Retain Go coverage sources for merger
        if: always() && steps.web_dependencies.outcome == 'success'
        id: coverage_sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-remaining-coverage-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: web/node_modules/flatted/golang/pkg/flatted/**/*.go
          retention-days: 14
          if-no-files-found: error
      - name: Reject tolerated runtime launches
        id: no_launch
        run: |
          if [ -e "$COPILOT_CLI_PATH.invoked" ]; then
            echo "Remaining test shard attempted to launch the Copilot runtime." >&2
            exit 1
          fi
      - name: Retain remaining-shard coverage and selection evidence
        if: always() && steps.remaining_tests.outcome != 'skipped' && steps.remaining_tests.outcome != ''
        id: coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-remaining-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-remaining-${{ matrix.shard }}.txt
            coverage-remaining-${{ matrix.shard }}.txt.all
            coverage-remaining-${{ matrix.shard }}.txt.selected
            coverage-remaining-${{ matrix.shard }}.txt.packages.all
            coverage-remaining-${{ matrix.shard }}.txt.packages.selected
            coverage-remaining-${{ matrix.shard }}.txt.evidence.json
          retention-days: 14
          if-no-files-found: error
      - name: Retain sanitized remaining-shard timing observation
        if: always() && steps.remaining_tests.outcome != 'skipped' && steps.remaining_tests.outcome != ''
        id: observation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-go-remaining-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: coverage-remaining-${{ matrix.shard }}.txt.evidence.json
          retention-days: 14
          if-no-files-found: error
      - name: Capture PR completeness receipt
        if: always() && inputs.pr_completeness
        id: receipt
        continue-on-error: true
        env:
          WAZA_COMPLETENESS_STEPS: ${{ toJSON(steps) }}
        run: |
          receipt_dir="$RUNNER_TEMP/pr-completeness-receipt-linux-remaining-${{ matrix.shard }}"
          mkdir -p "$receipt_dir"
          printf '%s' "$WAZA_COMPLETENESS_STEPS" > "$receipt_dir/steps.json"
          node .github/scripts/pr-completeness.cjs plan > "$receipt_dir/plan.json"
          node .github/scripts/pr-completeness.cjs receipt \
            "$receipt_dir/plan.json" go "linux-remaining-${{ matrix.shard }}" \
            "$receipt_dir/steps.json" > "$receipt_dir/receipt.json"
          node - "$receipt_dir/receipt.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`artifact_name=${receipt.artifact_name}\n`);
          NODE
      - name: Upload PR completeness receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/pr-completeness-receipt-linux-remaining-${{ matrix.shard }}/receipt.json
          if-no-files-found: error
