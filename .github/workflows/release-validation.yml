name: Release Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-test-shards:
    uses: ./.github/workflows/go-native-shards.yml

  build-test:
    name: Release build and remaining tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Require exact source
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"

      - name: Setup Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Download Dependencies
        run: go mod download

      - name: Download dashboard checker dependency
        run: go mod download golang.org/x/net

      - name: Setup Node.js (for web UI build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        working-directory: web
        run: npm ci && npm run build

      - name: Require built dashboard output
        run: GOOS= GOARCH= GOPROXY=off GOSUMDB=off go run ./.github/scripts/release-dashboard-check

      - name: Require clean packaged source
        run: bash .github/scripts/release_source_check.sh

      - name: Install and prove rejecting runtime guard
        run: bash .github/scripts/go_offline_env.sh >> "$GITHUB_ENV"

      - name: Test release gate failure handling
        run: |
          bash .github/scripts/release_gate_test.sh
          go test -count=1 -timeout=10m ./.github/scripts ./.github/scripts/publish-runner-reference-guard ./.github/scripts/verify-runner-reference-guard

      - name: Run Go Vet
        run: go vet ./...

      - name: Execute Tests
        run: |
          packages="$(go list ./...)"
          selected=()
          while IFS= read -r package; do
            if [ "$package" != github.com/microsoft/waza/internal/controlledcomparison ]; then
              selected+=("$package")
            fi
          done <<< "$packages"
          go test -v -race -count=1 -timeout=30m -coverprofile=coverage.txt -covermode=atomic "${selected[@]}"

      - name: Build Release Binary
        run: |
          go build -v -o waza ./cmd/waza
          bash .github/scripts/release_binary_check.sh waza
          ./waza --version

      - name: Integration Test
        run: bash .github/scripts/release_integration_test.sh ./waza

      - name: Record tested binary digest
        run: sha256sum waza > waza.sha256

      - name: Upload tested release binary and remaining coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tested-${{ github.sha }}
          path: |
            waza
            waza.sha256
            coverage.txt
          if-no-files-found: error

  windows-test:
    name: Windows release validation
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Require exact source
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"

      - name: Setup Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Setup Node.js (offline assertion oracle)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Ensure web/dist exists
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            echo '<!doctype html><html><head><title>waza</title></head><body>placeholder</body></html>' > web/dist/index.html
            echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">w</text></svg>' > web/dist/favicon.svg
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Install and prove Windows rejecting runtime guard
        run: bash .github/scripts/go_offline_env.sh >> "$GITHUB_ENV"

      - name: Execute complete Windows tests
        run: go test -v -race -count=1 -timeout=30m ./...

      - name: Reject forbidden Windows runtime launches
        run: test ! -e "$COPILOT_CLI_PATH.invoked"

  lint:
    name: Release lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Require exact source
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"

      - name: Setup Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Ensure web/dist exists (stub for go:embed)
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            echo '<!doctype html><html><head><title>waza</title></head><body>placeholder</body></html>' > web/dist/index.html
            echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">w</text></svg>' > web/dist/favicon.svg
          fi

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          working-directory: ./
          install-only: true

      - name: Test lint script failure handling
        run: bash .github/scripts/lint_test.sh

      - name: Verify pinned configuration and run golangci-lint
        run: bash .github/scripts/lint.sh

  complete:
    name: Complete exact-source release validation
    needs: [native-test-shards, build-test, windows-test, lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every validation branch
        env:
          NATIVE_RESULT: ${{ needs.native-test-shards.result }}
          BUILD_RESULT: ${{ needs.build-test.result }}
          WINDOWS_RESULT: ${{ needs.windows-test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$LINT_RESULT" = success

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require exact source
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"

      - name: Download tested release binary and remaining coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tested-${{ github.sha }}
          path: .

      - name: Download native coverage and discovery evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-coverage-native-*
          merge-multiple: true
          path: coverage-reports

      - name: Verify exhaustive native test selection and coverage
        run: |
          cp coverage.txt coverage-reports/coverage.txt
          bash .github/scripts/go_test_shard_verify.sh coverage-reports

      - name: Verify and restore tested binary
        run: |
          recorded_digest="$(cat waza.sha256)"
          actual_digest="$(sha256sum waza)"
          test "$recorded_digest" = "$actual_digest"
          chmod +x waza
          ./waza --version

      - name: Record validated source
        run: printf '%s\n' "$GITHUB_SHA" > source-sha.txt

      - name: Upload complete validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-${{ github.sha }}
          path: |
            waza
            waza.sha256
            source-sha.txt
          if-no-files-found: error
