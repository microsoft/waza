name: Squad Preview Validation
# go project — configure build, test, and validation commands below

on:
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Download Dependencies
        run: go mod download

      - name: Setup Node.js (for web UI build)
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install and prove rejecting runtime guard
        run: bash .github/scripts/go_offline_env.sh >> "$GITHUB_ENV"

      - name: Verify uncached compatibility inventory
        run: make test-compat-inventory

      - name: Build Web UI
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci && npm run build

      - name: Ensure web/dist exists
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            echo '<!doctype html><html><head><title>waza</title></head><body>placeholder</body></html>' > web/dist/index.html
            echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">w</text></svg>' > web/dist/favicon.svg
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Execute Tests
        run: go test -count=1 -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Reject tolerated runtime launches
        run: |
          if [ -e "$COPILOT_CLI_PATH.invoked" ]; then
            echo "Preview Go tests attempted to launch the Copilot runtime." >&2
            exit 1
          fi

      - name: Build Binary
        run: go build -v -o waza ./cmd/waza

      - name: Verify Binary
        run: ./waza --version

      - name: Integration Test
        run: bash .github/scripts/release_integration_test.sh ./waza
