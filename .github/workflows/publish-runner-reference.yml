name: Publish Release Runner Reference Image

on:
  workflow_call:
    inputs:
      release_stage:
        description: Release lifecycle stage
        required: true
        type: string
      source_sha:
        description: Exact source commit from the release tag
        required: true
        type: string
      version:
        description: Semver version without the v prefix
        required: true
        type: string
      qualification_artifact_name:
        description: Exact run-attempt qualification artifact produced by the caller
        required: true
        type: string
      qualification_run_attempt:
        description: Attempt that produced the exact qualification artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate exact release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.guard.outputs.source_sha }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Validate event, source, and exact tag
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_STAGE: ${{ inputs.release_stage }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION_INPUT: ${{ inputs.version }}
          QUALIFICATION_ARTIFACT_NAME: ${{ inputs.qualification_artifact_name }}
          QUALIFICATION_RUN_ATTEMPT: ${{ inputs.qualification_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = push
          test "$REPOSITORY" = microsoft/waza
          test "$RELEASE_STAGE" = released
          [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([-.+][A-Za-z0-9.-]+)?$ ]]
          version="${REF#refs/tags/v}"
          test "$VERSION_INPUT" = "$version"
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$SOURCE_SHA" = "$EVENT_SHA"
          test "$(git rev-parse "${REF}^{commit}")" = "$SOURCE_SHA"
          [[ "$QUALIFICATION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          expected_artifact="release-qualification-evidence-${SOURCE_SHA}-${GITHUB_RUN_ID}-${QUALIFICATION_RUN_ATTEMPT}"
          test "$QUALIFICATION_ARTIFACT_NAME" = "$expected_artifact"
          printf 'source_sha=%s\nversion=%s\n' "$SOURCE_SHA" "$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Linux AMD64 release image
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out validated release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - name: Download exact qualification evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.qualification_artifact_name }}
          path: ${{ runner.temp }}/qualification
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Require exact validated release source
        env:
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Require native Linux AMD64 runner
        if: runner.os != 'Linux' || runner.arch != 'X64'
        run: exit 1
      - name: Validate exact qualified runner image and inventory
        id: qualified
        env:
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          EXPECTED_TAG: v${{ needs.validate-release.outputs.version }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release-qualification.yml
          QUALIFICATION_DIR: ${{ runner.temp }}/qualification
        shell: bash
        run: |
          set -euo pipefail
          test -s "$QUALIFICATION_DIR/runner-image.oci.tar"
          test -s "$QUALIFICATION_DIR/runner-image.digest"
          test -s "$QUALIFICATION_DIR/runner-image.archive.sha256"
          image_digest="$(cat "$QUALIFICATION_DIR/runner-image.digest")"
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          (cd "$QUALIFICATION_DIR" && sha256sum --check runner-image.archive.sha256)
          manifest_digest="$(tar -xOf "$QUALIFICATION_DIR/runner-image.oci.tar" index.json |
            jq -er '.manifests | select(length == 1) | .[0].digest | select(test("^sha256:[a-f0-9]{64}$"))')"
          test "$manifest_digest" = "$image_digest"
          tar -xOf "$QUALIFICATION_DIR/runner-image.oci.tar" "blobs/sha256/${image_digest#sha256:}" \
            > "$RUNNER_TEMP/runner-image.manifest.json"
          test "$(sha256sum "$RUNNER_TEMP/runner-image.manifest.json" | cut -d' ' -f1)" = "${image_digest#sha256:}"
          go run ./cmd/waza runner inventory verify \
            --inventory "$QUALIFICATION_DIR/runner-inventory.cdx.json" \
            --image-digest "$image_digest" \
            --image-reference ghcr.io/microsoft/waza-runner-reference \
            > "$RUNNER_TEMP/runner-inventory-verification.json"
          common=(--repo "$GITHUB_REPOSITORY" --custom-trusted-root "$QUALIFICATION_DIR/trusted_root.jsonl" \
            --signer-workflow "$SIGNER_WORKFLOW" --format json)
          gh attestation verify "$RUNNER_TEMP/runner-image.manifest.json" "${common[@]}" \
            --source-digest "$SOURCE_SHA" \
            --bundle "$QUALIFICATION_DIR/attestations/runner-image.json" \
            > "$RUNNER_TEMP/runner-image-provenance-verification.json"
          gh attestation verify "$RUNNER_TEMP/runner-image.manifest.json" "${common[@]}" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-digest "$SOURCE_SHA" \
            --bundle "$QUALIFICATION_DIR/attestations/runner-inventory.json" \
            > "$RUNNER_TEMP/runner-inventory-attestation-verification.json"
          jq -e --slurpfile inventory "$QUALIFICATION_DIR/runner-inventory.cdx.json" \
            'any(.[]; .verificationResult.statement.predicate == $inventory[0])' \
            "$RUNNER_TEMP/runner-inventory-attestation-verification.json" >/dev/null
          printf 'image_digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          skopeo --version
      - name: Log in to GHCR
        id: login
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Admit existing release image only at the qualified digest
        id: existing_image
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          IMAGE_DIGEST: ${{ steps.qualified.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/microsoft/waza-runner-reference:v${VERSION}"
          error="$RUNNER_TEMP/registry-inspect-error.txt"
          if skopeo inspect --authfile "$HOME/.docker/config.json" --raw "docker://$image" \
            > "$RUNNER_TEMP/existing-image-manifest.json" 2>"$error"; then
            remote_digest="$(skopeo inspect --authfile "$HOME/.docker/config.json" --format '{{.Digest}}' "docker://$image")"
            if [ "$remote_digest" != "$IMAGE_DIGEST" ]; then
              echo "Release image tag $image already exists at $remote_digest, not the qualified digest $IMAGE_DIGEST." >&2
              exit 1
            fi
            printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/published-image.digest"
            printf 'already_published=true\n' >> "$GITHUB_OUTPUT"
            echo "$image already names the exact qualified digest; continuing without replacing it."
          elif ! grep -Eq 'manifest unknown|name unknown|404 Not Found' "$error"; then
            cat "$error" >&2
            echo "Could not prove the release image tag is absent; refusing publication." >&2
            exit 1
          else
            printf 'already_published=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the exact qualified OCI image digest
        id: publish_image
        if: steps.existing_image.outputs.already_published != 'true'
        env:
          IMAGE_DIGEST: ${{ steps.qualified.outputs.image_digest }}
          IMAGE_TAG: ghcr.io/microsoft/waza-runner-reference:v${{ needs.validate-release.outputs.version }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          skopeo copy --preserve-digests \
            --dest-authfile "$HOME/.docker/config.json" \
            --digestfile "$RUNNER_TEMP/published-image.digest" \
            "oci-archive:$RUNNER_TEMP/qualification/runner-image.oci.tar" \
            "docker://$IMAGE_TAG"
          published_digest="$(cat "$RUNNER_TEMP/published-image.digest")"
          remote_digest="$(skopeo inspect --authfile "$HOME/.docker/config.json" --format '{{.Digest}}' "docker://$IMAGE_TAG")"
          test "$published_digest" = "$IMAGE_DIGEST"
          test "$remote_digest" = "$IMAGE_DIGEST"
      - name: Attest published runner image provenance
        id: image_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/microsoft/waza-runner-reference
          subject-digest: ${{ steps.qualified.outputs.image_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify published runner image provenance offline
        id: verify_provenance
        env:
          IMAGE_DIGEST: ${{ steps.qualified.outputs.image_digest }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          PROVENANCE_BUNDLE: ${{ steps.image_attestation.outputs.bundle-path }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-runner-reference.yml
        shell: bash
        run: |
          set -euo pipefail
          gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
          gh attestation verify "oci://ghcr.io/microsoft/waza-runner-reference@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$SOURCE_SHA" \
            --source-digest "$SOURCE_SHA" \
            --custom-trusted-root "$RUNNER_TEMP/trusted_root.jsonl" \
            --bundle "$PROVENANCE_BUNDLE" \
            --format json > "$RUNNER_TEMP/runner-image-provenance-verification.json"
          cp "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/runner-image-provenance-attestation.json"
      - name: Attest published runner image inventory
        id: inventory_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/microsoft/waza-runner-reference
          subject-digest: ${{ steps.qualified.outputs.image_digest }}
          sbom-path: ${{ runner.temp }}/qualification/runner-inventory.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify published image inventory attestation offline
        id: verify_inventory
        env:
          IMAGE_DIGEST: ${{ steps.qualified.outputs.image_digest }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          SBOM_BUNDLE: ${{ steps.inventory_attestation.outputs.bundle-path }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-runner-reference.yml
          QUALIFICATION_DIR: ${{ runner.temp }}/qualification
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://ghcr.io/microsoft/waza-runner-reference@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --signer-digest "$SOURCE_SHA" \
            --predicate-type https://cyclonedx.org/bom \
            --custom-trusted-root "$RUNNER_TEMP/trusted_root.jsonl" \
            --bundle "$SBOM_BUNDLE" \
            --format json > "$RUNNER_TEMP/runner-inventory-attestation-verification.json"
          jq -e --slurpfile inventory "$QUALIFICATION_DIR/runner-inventory.cdx.json" \
            'any(.[]; .verificationResult.statement.predicate == $inventory[0])' \
            "$RUNNER_TEMP/runner-inventory-attestation-verification.json" >/dev/null
          cp "$SBOM_BUNDLE" "$RUNNER_TEMP/runner-inventory-attestation.json"
          cp "$QUALIFICATION_DIR/runner-inventory.cdx.json" "$RUNNER_TEMP/runner-inventory.cdx.json"
          cp "$RUNNER_TEMP/trusted_root.jsonl" "$RUNNER_TEMP/runner-inventory-trusted-root.jsonl"
      - name: Upload runner image publication evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/published-image.digest
            ${{ runner.temp }}/runner-image-provenance-attestation.json
            ${{ runner.temp }}/runner-image-provenance-verification.json
            ${{ runner.temp }}/runner-inventory.cdx.json
            ${{ runner.temp }}/runner-inventory-attestation.json
            ${{ runner.temp }}/runner-inventory-attestation-verification.json
            ${{ runner.temp }}/runner-inventory-trusted-root.jsonl
          if-no-files-found: error
          retention-days: 90
      - name: Revalidate release tag after publication
        id: final_guard
        env:
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF"
          fetched_tag_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          test "$fetched_tag_sha" = "$SOURCE_SHA"
      - name: Log out of GHCR
        if: always() && steps.login.outcome == 'success'
        run: docker logout ghcr.io
      - name: Record published release digest
        if: success()
        env:
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.qualified.outputs.image_digest }}
          IMAGE_TAG: ghcr.io/microsoft/waza-runner-reference:v${{ needs.validate-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Published the exact qualified image digest and verified its signed provenance and inventory attestations for source `%s`.\n\nTag: `%s`\n\nImmutable digest reference: `ghcr.io/microsoft/waza-runner-reference@%s`\n\nPlatform: `linux/amd64`\n' \
            "$SOURCE_SHA" "$IMAGE_TAG" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Mark incomplete release image publication
        if: always() && (steps.publish_image.outcome == 'success' || steps.publish_image.outcome == 'failure' || steps.existing_image.outputs.already_published == 'true') && (steps.publish_image.outcome == 'failure' || steps.image_attestation.outcome != 'success' || steps.verify_provenance.outcome != 'success' || steps.inventory_attestation.outcome != 'success' || steps.verify_inventory.outcome != 'success' || steps.final_guard.outcome != 'success')
        env:
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.qualified.outputs.image_digest }}
          IMAGE_TAG: ghcr.io/microsoft/waza-runner-reference:v${{ needs.validate-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'INCOMPLETE — do not consume this release image. The push may have completed, but signed provenance, inventory attestation, or tag revalidation did not succeed.\n\nSource: `%s`\n\nTag: `%s`\n\nDigest, if recorded: `%s`\n\nNo rollback is claimed. Verify registry state and rerun the complete release publication acceptance only after the cause is resolved.\n' \
            "$SOURCE_SHA" "$IMAGE_TAG" "${IMAGE_DIGEST:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
