name: Publish Runner Reference Image

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of the reviewed, checked main candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-candidate:
    name: Validate protected main candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.guard.outputs.candidate_sha }}
    steps:
      - name: Check out workflow candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch current main
        run: git fetch --no-tags origin refs/heads/main
      - name: Validate event, source and exact candidate
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: go run ./.github/scripts/publish-runner-reference-guard

  publish:
    name: Publish reviewed Linux AMD64 image
    needs: validate-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-candidate.outputs.candidate_sha }}
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch current main
        run: git fetch --no-tags origin refs/heads/main
      - name: Revalidate exact candidate before publishing
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
        run: go run ./.github/scripts/publish-runner-reference-guard
      - name: Require a clean source checkout
        env:
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --verify HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo "Checked-out source does not match the validated candidate." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Refusing to publish from a modified or untracked source tree." >&2
            git status --short
            exit 1
          fi
      - name: Require native Linux AMD64 runner
        if: runner.os != 'Linux' || runner.arch != 'X64'
        run: exit 1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        id: login
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Revalidate protected main immediately before push
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          go run ./.github/scripts/publish-runner-reference-guard
      - name: Build and publish exact candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: examples/runner/container/Dockerfile
          target: native-reference
          platforms: linux/amd64
          push: true
          tags: ghcr.io/microsoft/waza-runner-reference:candidate-${{ needs.validate-candidate.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/microsoft/waza
            org.opencontainers.image.revision=${{ needs.validate-candidate.outputs.candidate_sha }}
          provenance: mode=max
          sbom: true
      - name: Validate immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Build action did not return a valid immutable image digest." >&2
            exit 1
          fi
      - name: Attest published image digest
        id: attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/microsoft/waza-runner-reference
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Revalidate protected main after push and attestation
        id: final_guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          go run ./.github/scripts/publish-runner-reference-guard
      - name: Log out of GHCR
        if: always() && steps.login.outcome == 'success'
        run: docker logout ghcr.io
      - name: Record pushed candidate digest
        if: success()
        env:
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ghcr.io/microsoft/waza-runner-reference:candidate-${{ needs.validate-candidate.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Push and signed provenance creation succeeded for candidate `%s`.\n\nTag: `%s`\n\nImmutable digest reference: `ghcr.io/microsoft/waza-runner-reference@%s`\n\nPlatform: `linux/amd64`\n\nThis digest is not accepted for use until the separate anonymous public-digest verification workflow succeeds. Package visibility is not established by this push.\n' \
            "$CANDIDATE_SHA" "$IMAGE_TAG" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Mark pushed digest as unaccepted when finalization fails
        if: always() && steps.build.outcome == 'success' && (steps.attestation.outcome != 'success' || steps.final_guard.outcome != 'success')
        env:
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ghcr.io/microsoft/waza-runner-reference:candidate-${{ needs.validate-candidate.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'INCOMPLETE — do not use this candidate. The push may have completed, but signed provenance or the post-push current-main check did not succeed.\n\nCandidate: `%s`\n\nTag: `%s`\n\nDigest, if recorded: `%s`\n\nNo rollback is claimed. Verify registry state and rerun the complete publication acceptance only after the cause is resolved.\n' \
            "$CANDIDATE_SHA" "$IMAGE_TAG" "${IMAGE_DIGEST:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
