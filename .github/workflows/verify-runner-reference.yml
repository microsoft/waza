name: Verify Published Runner Reference

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full source commit recorded in the published image label
        required: true
        type: string
      image_digest:
        description: Immutable sha256 digest from the publisher summary
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-public-digest:
    name: Validate source and published provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
      actions: read
    outputs:
      source_sha: ${{ steps.guard.outputs.source_sha }}
      image_digest: ${{ steps.guard.outputs.image_digest }}
    steps:
      - name: Check out verification workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch current main
        run: git fetch --no-tags origin refs/heads/main
      - name: Validate source and immutable digest inputs
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.source_revision }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: go run ./.github/scripts/verify-runner-reference-guard
      - name: Verify signed provenance for the exact digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REVISION: ${{ steps.guard.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.guard.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://ghcr.io/microsoft/waza-runner-reference@$IMAGE_DIGEST" \
            --repo microsoft/waza \
            --signer-workflow microsoft/waza/.github/workflows/publish-runner-reference.yml \
            --signer-digest "$SOURCE_REVISION" \
            --source-digest "$SOURCE_REVISION" \
            --source-ref refs/heads/main \
            --format json > "$RUNNER_TEMP/verified-runner-provenance.json"
      - name: Verify signed component inventory for the exact digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REVISION: ${{ steps.guard.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.guard.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          verified="$RUNNER_TEMP/verified-runner-inventory.json"
          gh attestation verify "oci://ghcr.io/microsoft/waza-runner-reference@$IMAGE_DIGEST" \
            --repo microsoft/waza \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow microsoft/waza/.github/workflows/publish-runner-reference.yml \
            --signer-digest "$SOURCE_REVISION" \
            --source-digest "$SOURCE_REVISION" \
            --source-ref refs/heads/main \
            --format json > "$verified"
          count="$(jq 'length' "$verified")"
          if [[ "$count" -lt 1 ]]; then
            echo "No signed component inventory is attached to the published digest." >&2
            exit 1
          fi
          for ((i = 0; i < count; i++)); do
            jq ".[$i].verificationResult.statement.predicate" "$verified" > "$RUNNER_TEMP/runner-inventory-$i.cdx.json"
            go run ./cmd/waza runner inventory verify \
              --inventory "$RUNNER_TEMP/runner-inventory-$i.cdx.json" \
              --image-digest "$IMAGE_DIGEST" \
              --image-reference ghcr.io/microsoft/waza-runner-reference
          done
      - name: Require successful publisher run and finalization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.guard.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.guard.outputs.image_digest }}
        run: go run ./.github/scripts/verify-runner-reference-guard --finalized-publication "$RUNNER_TEMP/verified-runner-provenance.json"

  verify-public-image:
    name: Verify anonymous Linux AMD64 digest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: validate-public-digest
    permissions:
      contents: read
    steps:
      - name: Require native Linux AMD64 runner
        if: runner.os != 'Linux' || runner.arch != 'X64'
        run: exit 1
      - name: Check out validated source fixtures and probes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-public-digest.outputs.source_sha }}
          path: candidate
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: candidate/go.mod
          cache: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify anonymous immutable digest and production callers
        working-directory: candidate
        env:
          WAZA_IMAGE_SOURCE_REVISION: ${{ needs.validate-public-digest.outputs.source_sha }}
          WAZA_IMAGE_DIGEST: ${{ needs.validate-public-digest.outputs.image_digest }}
        run: node --test examples/runner/container/published-image-test.mjs
      - name: Record verified public digest
        if: success()
        env:
          SOURCE_REVISION: ${{ needs.validate-public-digest.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.validate-public-digest.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Anonymous public pull and production-caller smoke passed.\n\nSource revision: `%s`\n\nImmutable digest: `ghcr.io/microsoft/waza-runner-reference@%s`\n\nVerified platform: `linux/amd64`\n' \
            "$SOURCE_REVISION" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
