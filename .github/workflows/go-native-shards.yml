name: Native Go Test Shards

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Native regression shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Setup Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: Test shard discovery and failure handling
        run: bash .github/scripts/go_test_shard_test.sh
      - name: Execute exhaustive native test shard
        env:
          SHARD: ${{ matrix.shard }}
        run: bash .github/scripts/go_test_shard.sh "$SHARD" "coverage-native-$SHARD.txt"
      - name: Retain coverage and test-selection evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-native-${{ matrix.shard }}
          path: coverage-native-${{ matrix.shard }}.txt*
          if-no-files-found: error
