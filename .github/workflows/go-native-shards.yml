name: Native Go Test Shards

on:
  workflow_call:
    inputs:
      cold_observation:
        description: Observe initially empty isolated Linux dependency stores
        type: boolean
        default: false
        required: false
      pr_completeness:
        description: Capture same-run PR completeness receipts
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  native:
    name: Native regression shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_EVIDENCE_COLD_REQUESTED: ${{ inputs.cold_observation }}
      CI_EVIDENCE_COLD_SETUP_CACHE_DISABLED: ${{ inputs.cold_observation }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 2
      - name: Record receipt checkout
        if: inputs.pr_completeness
        id: checkout
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Go Environment
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: ${{ !inputs.cold_observation }}
          cache-dependency-path: go.sum
      - name: Setup Node for sanitized evidence
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: ${{ !inputs.cold_observation }}
      - name: Observe initially empty isolated stores
        if: inputs.cold_observation
        run: node .github/scripts/ci-evidence-cache.cjs prepare go
      - name: Test shard discovery and failure handling
        id: discovery_controls
        env:
          CI_EVIDENCE_COLD_REQUESTED: 'false'
        run: bash .github/scripts/go_test_shard_test.sh
      - name: Install and prove rejecting runtime guard
        id: guard
        run: bash .github/scripts/go_offline_env.sh >> "$GITHUB_ENV"
      - name: Execute exhaustive native test shard
        id: native_tests
        env:
          SHARD: ${{ matrix.shard }}
          GO_CACHE_HIT: ${{ steps.go.outputs.cache-hit }}
        run: |
          bash .github/scripts/go_test_shard.sh "$SHARD" "coverage-native-$SHARD.txt"
          if [ -e "$COPILOT_CLI_PATH.invoked" ]; then
            echo "Native shard attempted to launch the Copilot runtime." >&2
            exit 1
          fi
      - name: Retain sanitized native execution evidence
        if: always() && steps.native_tests.outcome != 'skipped' && steps.native_tests.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-go-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: coverage-native-${{ matrix.shard }}.txt.evidence.json
          retention-days: 14
          if-no-files-found: warn
      - name: Retain coverage and test-selection evidence
        id: coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-native-${{ matrix.shard }}
          path: |
            coverage-native-${{ matrix.shard }}.txt
            coverage-native-${{ matrix.shard }}.txt.all
            coverage-native-${{ matrix.shard }}.txt.selected
          if-no-files-found: error
      - name: Capture PR completeness receipt
        if: always() && inputs.pr_completeness
        id: receipt
        # A stale-base receipt failure must not fail the shard; admission
        # still fails closed on the missing receipt.
        continue-on-error: true
        env:
          WAZA_COMPLETENESS_STEPS: ${{ toJSON(steps) }}
        run: |
          receipt_dir="$RUNNER_TEMP/pr-completeness-receipt-native-${{ matrix.shard }}"
          mkdir -p "$receipt_dir"
          printf '%s' "$WAZA_COMPLETENESS_STEPS" > "$receipt_dir/steps.json"
          node .github/scripts/pr-completeness.cjs plan > "$receipt_dir/plan.json"
          node .github/scripts/pr-completeness.cjs receipt \
            "$receipt_dir/plan.json" go "native-${{ matrix.shard }}" \
            "$receipt_dir/steps.json" > "$receipt_dir/receipt.json"
          node - "$receipt_dir/receipt.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`artifact_name=${receipt.artifact_name}\n`);
          NODE
      - name: Upload PR completeness receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/pr-completeness-receipt-native-${{ matrix.shard }}/receipt.json
          if-no-files-found: error
