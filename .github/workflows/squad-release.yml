name: Squad Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release-candidate:
    name: Detect exact stable tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Detect exact stable tag
        id: tag
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tag_output="$(git tag --points-at "$GITHUB_SHA" --list 'v*.*.*')"
          candidates=()
          if [ -n "$tag_output" ]; then
            mapfile -t candidates <<< "$tag_output"
          fi
          tags=()
          for tag in "${candidates[@]}"; do
            if [[ "$tag" != *-insider ]]; then
              tags+=("$tag")
            fi
          done
          if [ "${#tags[@]}" -gt 1 ]; then
            echo "Multiple stable tags point at $GITHUB_SHA" >&2
            exit 1
          fi
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tags[0]}" >> "$GITHUB_OUTPUT"

  validation:
    needs: [release-candidate]
    if: needs.release-candidate.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-validation.yml

  release:
    needs: [release-candidate, validation]
    if: needs.release-candidate.outputs.publish == 'true' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful complete validation
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success

      - name: Download complete validation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-validation-${{ github.sha }}
          path: .

      - name: Require exact validated source and tested binary
        run: |
          test "$(cat source-sha.txt)" = "$GITHUB_SHA"
          test "$(cat waza.sha256)" = "$(sha256sum waza)"
          chmod +x waza
          ./waza --version

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-candidate.outputs.tag }}
        run: |
          if gh release view "$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $VERSION already exists; inspect its source and assets before retrying publication." >&2
            exit 1
          else
            gh release create "$VERSION" ./waza ./waza.sha256 ./source-sha.txt \
              --repo "${{ github.repository }}" \
              --title "Release $VERSION" \
              --notes "Go implementation of waza CLI" \
              --latest
          fi
