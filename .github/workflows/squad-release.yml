name: Squad Release
# go project — configure build, test, and release commands below

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  native-test-shards:
    uses: ./.github/workflows/go-native-shards.yml

  build-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Download Dependencies
        run: go mod download

      - name: Setup Node.js (for web UI build)
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci && npm run build

      - name: Ensure web/dist exists
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            echo '<!doctype html><html><head><title>waza</title></head><body>placeholder</body></html>' > web/dist/index.html
            echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">w</text></svg>' > web/dist/favicon.svg
          fi

      - name: Install and prove rejecting runtime guard
        run: bash .github/scripts/go_offline_env.sh >> "$GITHUB_ENV"

      - name: Test release gate failure handling
        run: |
          bash .github/scripts/release_gate_test.sh
          go test -count=1 -timeout=10m ./.github/scripts ./.github/scripts/publish-runner-reference-guard ./.github/scripts/verify-runner-reference-guard

      - name: Run Go Vet
        run: go vet ./...

      - name: Execute Tests
        run: |
          packages="$(go list ./...)"
          selected=()
          while IFS= read -r package; do
            if [ "$package" != github.com/microsoft/waza/internal/controlledcomparison ]; then
              selected+=("$package")
            fi
          done <<< "$packages"
          go test -v -race -timeout=30m -coverprofile=coverage.txt -covermode=atomic "${selected[@]}"

      - name: Build Release Binary
        run: |
          go build -v -o waza ./cmd/waza
          ./waza --version

      - name: Integration Test
        run: bash .github/scripts/release_integration_test.sh ./waza

      - name: Record tested binary digest
        run: sha256sum waza > waza.sha256

      - name: Upload tested release binary and remaining coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tested-${{ github.sha }}
          path: |
            waza
            waza.sha256
            coverage.txt
          if-no-files-found: error

  release:
    needs: [native-test-shards, build-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require every validation branch
        env:
          NATIVE_RESULT: ${{ needs.native-test-shards.result }}
          BUILD_RESULT: ${{ needs.build-test.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$BUILD_RESULT" = success

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download tested release binary and remaining coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tested-${{ github.sha }}
          path: .

      - name: Download native coverage and discovery evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-coverage-native-*
          merge-multiple: true
          path: coverage-reports

      - name: Verify exhaustive native test selection and coverage
        run: |
          cp coverage.txt coverage-reports/coverage.txt
          bash .github/scripts/go_test_shard_verify.sh coverage-reports

      - name: Verify and restore tested binary
        run: |
          sha256sum --check waza.sha256
          chmod +x waza
          ./waza --version

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! VERSION=$(git describe --tags --exact-match 2>/dev/null); then
            echo "Current commit is not tagged, skipping release creation"
            exit 0
          fi

          if gh release view "$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping creation"
          else
            gh release create "$VERSION" ./waza \
              --repo "${{ github.repository }}" \
              --title "Release $VERSION" \
              --notes "Go implementation of waza CLI" \
              --latest
          fi
