name: Skills CI Example - Waza Evaluation

# This is a template workflow for microsoft/skills repositories.
# Copy this file to your skill repository's .github/workflows/ directory
# and customize it for your skill.
#
# This example shows how to:
# 1. Install the published Go waza binary
# 2. Run evaluations with the mock executor (no API keys needed)
# 3. Upload results as artifacts
# 4. Use exit codes for CI pass/fail

on:
  # Trigger on pull requests
  pull_request:
    branches: [ main ]
    paths:
      - 'SKILL.md'
      - 'eval/**'
      - '.github/workflows/skills-ci-example.yml'
  
  # Trigger on pushes to main
  push:
    branches: [ main ]
    paths:
      - 'SKILL.md'
      - 'eval/**'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      eval-yaml:
        description: 'Path to evaluation YAML file'
        required: false
        type: string
        default: 'eval/eval.yaml'

permissions:
  contents: read

jobs:
  evaluate-skill:
    name: Evaluate Skill with Waza
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Waza
        run: |
          curl -fsSL https://raw.githubusercontent.com/microsoft/waza/main/install.sh | bash
          echo "$HOME/bin" >> "$GITHUB_PATH"
          waza --version
      
      - name: Determine Eval File
        id: eval-file
        env:
          EVAL_INPUT: ${{ inputs.eval-yaml }}
        run: |
          EVAL_FILE="${EVAL_INPUT:-eval/eval.yaml}"
          if [[ "$EVAL_FILE" == *$'\n'* || "$EVAL_FILE" == *$'\r'* ]]; then
            echo "::error::Evaluation file must be a single-line path"
            exit 1
          fi
          
          # Verify file exists
          if [ ! -f "$EVAL_FILE" ]; then
            echo "::error::Evaluation file not found: $EVAL_FILE"
            echo "Expected structure:"
            echo "  your-skill/"
            echo "  ├── SKILL.md"
            echo "  └── eval/"
            echo "      ├── eval.yaml"
            echo "      ├── tasks/"
            echo "      └── fixtures/"
            exit 1
          fi
          
          echo "eval-file=$EVAL_FILE" >> "$GITHUB_OUTPUT"
          echo "Using eval file: $EVAL_FILE"
      
      - name: Run Waza Evaluation
        id: run-eval
        run: |
          EVAL_FILE="${{ steps.eval-file.outputs.eval-file }}"
          rm -f -- results.json
          set +e
          waza run "$EVAL_FILE" \
            --verbose \
            --output results.json
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Validate Results
        id: validate
        if: always()
        env:
          RUN_EXIT_CODE: ${{ steps.run-eval.outputs.exit_code }}
        run: |
          if [ ! -s results.json ]; then
            echo "::error::Waza did not produce results.json"
            exit 1
          fi
          jq -e '
            .schemaVersion and .eval_id and
            (.summary.success_rate | type == "number") and
            (.summary.aggregate_score | type == "number") and
            (.summary.weighted_score | type == "number") and
            (.tasks | type == "array") and
            (.summary.total_tests == (.tasks | length))
          ' results.json >/dev/null
          if [ "$RUN_EXIT_CODE" != "0" ]; then
            echo "::error::Waza evaluation exited with code $RUN_EXIT_CODE"
            exit 1
          fi
      
      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waza-evaluation-results
          path: |
            results.json
            transcripts/
          retention-days: 30
          if-no-files-found: error
      
      - name: Display Results Summary
        if: always()
        run: |
          if [ -f results.json ]; then
            echo "## Evaluation Results" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            head -50 results.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      
      - name: Check Evaluation Status
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if [ "$VALIDATION_OUTCOME" != "success" ]; then
            exit 1
          fi

