name: Waza Evaluation

on:
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      eval-yaml:
        description: 'Path to evaluation YAML file'
        required: true
        type: string
        default: 'examples/code-explainer/eval.yaml'
      context-dir:
        description: 'Context directory for fixtures (relative to eval.yaml if not absolute)'
        required: false
        type: string
        default: ''
      verbose:
        description: 'Enable verbose output'
        required: false
        type: boolean
        default: true
      output-file:
        description: 'Output JSON file path for results'
        required: false
        type: string
        default: 'results.json'
      artifact-name:
        description: 'Name for the results artifact'
        required: false
        type: string
        default: 'waza-evaluation-results'
  
  # Allow use as a reusable workflow
  workflow_call:
    inputs:
      eval-yaml:
        description: 'Path to evaluation YAML file'
        required: true
        type: string
      context-dir:
        description: 'Context directory for fixtures (relative to eval.yaml if not absolute)'
        required: false
        type: string
        default: ''
      verbose:
        description: 'Enable verbose output'
        required: false
        type: boolean
        default: true
      output-file:
        description: 'Output JSON file path for results'
        required: false
        type: string
        default: 'results.json'
      artifact-name:
        description: 'Name for the results artifact'
        required: false
        type: string
        default: 'waza-evaluation-results'
  
  # Trigger on PR to main branches
  # Note: When triggered automatically, this workflow runs the default eval file
  # (examples/code-explainer/eval.yaml). For testing specific eval files, use
  # workflow_dispatch or create dedicated workflows per example.
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'examples/**/*.yaml'
      - 'examples/**/*.yml'
      - 'skills/**'
      - 'internal/execution/**'
      - 'internal/orchestration/**'
      - 'internal/graders/**'
      - '.github/workflows/waza-eval.yml'
      - '.github/scripts/validate-waza-result.sh'
      - '.github/scripts/waza_workflow_contract_test.go'
  
  # Trigger on push to main branches
  push:
    branches: [ main, develop ]
    paths:
      - 'examples/**/*.yaml'
      - 'examples/**/*.yml'
      - 'skills/**'
      - 'internal/execution/**'
      - 'internal/orchestration/**'
      - 'internal/graders/**'
      - '.github/workflows/waza-eval.yml'
      - '.github/scripts/validate-waza-result.sh'
      - '.github/scripts/waza_workflow_contract_test.go'

permissions:
  contents: read

jobs:
  run-evaluation:
    name: Run Waza Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      
      - name: Setup Go Environment
        if: github.repository == 'microsoft/waza'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Setup Node.js
        if: github.repository == 'microsoft/waza'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      
      - name: Build Waza Binary
        if: github.repository == 'microsoft/waza'
        run: |
          make build VERSION=0.41.0
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Install published Go binary for external callers
        if: github.repository != 'microsoft/waza'
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/microsoft/waza/v0.41.0/.github/scripts/install-waza-release.sh \
            -o "$RUNNER_TEMP/install-waza-release.sh"
          bash "$RUNNER_TEMP/install-waza-release.sh" 0.41.0

      - name: Guard automatic repository evaluations
        if: github.repository == 'microsoft/waza' && (github.event_name == 'push' || github.event_name == 'pull_request')
        run: bash .github/scripts/go_offline_env.sh >> "$GITHUB_ENV"
      
      - name: Verify Binary
        run: waza --version
      
      - name: Resolve effective inputs
        id: effective
        env:
          EVAL_INPUT: ${{ inputs.eval-yaml }}
          CONTEXT_INPUT: ${{ inputs.context-dir }}
          VERBOSE_INPUT: ${{ inputs.verbose }}
          OUTPUT_INPUT: ${{ inputs.output-file }}
          ARTIFACT_INPUT: ${{ inputs.artifact-name }}
        run: |
          EVAL_FILE="${EVAL_INPUT:-examples/code-explainer/eval.yaml}"
          CONTEXT_DIR="$CONTEXT_INPUT"
          VERBOSE="${VERBOSE_INPUT:-true}"
          OUTPUT_FILE="${OUTPUT_INPUT:-results.json}"
          ARTIFACT_NAME="${ARTIFACT_INPUT:-waza-evaluation-results}"
          for value in "$EVAL_FILE" "$CONTEXT_DIR" "$OUTPUT_FILE" "$ARTIFACT_NAME"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::Workflow path and artifact inputs must be single-line values"
              exit 1
            fi
          done
          echo "eval-file=$EVAL_FILE" >> "$GITHUB_OUTPUT"
          echo "context-dir=$CONTEXT_DIR" >> "$GITHUB_OUTPUT"
          echo "verbose=$VERBOSE" >> "$GITHUB_OUTPUT"
          echo "output-file=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      
      - name: Run Evaluation
        id: run-eval
        env:
          EVAL_FILE: ${{ steps.effective.outputs.eval-file }}
          CONTEXT_DIR: ${{ steps.effective.outputs.context-dir }}
          VERBOSE: ${{ steps.effective.outputs.verbose }}
          OUTPUT_FILE: ${{ steps.effective.outputs.output-file }}
        run: |
          rm -f -- "$OUTPUT_FILE"
          CMD=(waza run "$EVAL_FILE")
          if [ -n "$CONTEXT_DIR" ]; then
            CMD+=("--context-dir" "$CONTEXT_DIR")
          fi
          if [ "$VERBOSE" = "true" ]; then
            CMD+=("--verbose")
          fi
          CMD+=("--output" "$OUTPUT_FILE")
          echo "Running: ${CMD[*]}"
          set +e
          "${CMD[@]}"
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Validate result artifact and generate summary
        id: validate
        if: always()
        env:
          OUTPUT_FILE: ${{ steps.effective.outputs.output-file }}
          RUN_EXIT_CODE: ${{ steps.run-eval.outputs.exit_code }}
          REPOSITORY: ${{ github.repository }}
        run: |
          validator=.github/scripts/validate-waza-result.sh
          if [ "$REPOSITORY" != microsoft/waza ]; then
            validator="$RUNNER_TEMP/validate-waza-result.sh"
            curl -fsSL \
              https://raw.githubusercontent.com/microsoft/waza/v0.41.0/.github/scripts/validate-waza-result.sh \
              -o "$validator"
          fi
          bash "$validator" "$OUTPUT_FILE" 0 "$RUN_EXIT_CODE"
          if [ -n "${COPILOT_CLI_PATH:-}" ] && [ -e "$COPILOT_CLI_PATH.invoked" ]; then
            echo "::error::Automatic evaluation attempted to launch the Copilot runtime"
            exit 1
          fi
      
      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.effective.outputs.artifact-name }}
          path: |
            ${{ steps.effective.outputs.output-file }}
            transcripts/
          retention-days: 30
          if-no-files-found: error
      
      - name: Check Evaluation Status
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          EVALUATION_STATUS: ${{ steps.validate.outputs.status }}
        run: |
          if [ "$VALIDATION_OUTCOME" != "success" ] || [ "$EVALUATION_STATUS" != "success" ]; then
            exit 1
          fi
