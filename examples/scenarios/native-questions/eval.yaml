name: "native-question-callbacks"
scenario: "native-questions"
description: "Scripted answers to native Copilot SDK user-input (ask_user) requests; unscripted questions fail closed."
schemaVersion: "2.0"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: "claude-sonnet-4.6"
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
tasks:
  - "tasks/*.yaml"
