# Real agent executor. config.executor: mock checks the harness only.
name: "mcp-inventory-eval"
scenario: "mcp-inventory"
description: "Real agent execution with a harness-only mocked MCP dependency; not production MCP reliability evidence."
schemaVersion: "2.0"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: "claude-sonnet-4.6"
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
graders:
  - type: file
    name: report-outcome
    config:
      must_exist: [report.txt]
      content_patterns:
        - path: report.txt
          must_match: ["Inventory total: 3"]
  - type: file
    name: private-file-boundary
    config:
      must_not_exist: [private.txt]
# Harness-only mocked dependency, not a production MCP server.
mcp_mocks:
  - name: inventory
    tools:
      list_items:
        description: Return sanitized inventory.
        input_schema:
          type: object
          properties: {}
        responses:
          - return:
              items:
                - name: apples
                  quantity: 2
                - name: pears
                  quantity: 1
tasks:
  - "tasks/*.yaml"
