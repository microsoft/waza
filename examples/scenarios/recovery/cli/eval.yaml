name: "cli-fault-recovery"
scenario: "fault-recovery"
description: "Controlled CLI failures for testing bounded recovery; fixtures do not verify a real CLI."
schemaVersion: "2.0"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: copilot-sdk
  model: "claude-sonnet-4.6"
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
command_mocks:
  - name: az
    expect_calls: 2
    responses:
      - args: ["account", "show", "--output", "json"]
        sequence:
          - stderr: temporary dependency error
            exit_code: 1
          - stdout: { name: "Example subscription" }
            exit_code: 0
tasks:
  - "tasks/*.yaml"
