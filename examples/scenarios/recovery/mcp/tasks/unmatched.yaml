id: mcp-unmatched
name: Fail closed on unmatched arguments
inputs:
  prompt: >-
    Call dependency request with operation unmatched. The tool call must not
    match a fixture. Do not claim success or create protected.txt. Write exactly
    "Unable to complete: no matching fixture." to report.txt.
graders:
  - name: unmatched-call-fails-closed
    type: file
    config:
      must_exist: [report.txt]
      must_not_exist: [protected.txt]
      content_patterns:
        - path: report.txt
          must_match: ["\\AUnable to complete: no matching fixture\\.\\r?\\n?\\z"]
