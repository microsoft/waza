id: mcp-transient
name: Recover from one transient error
inputs:
  prompt: Call dependency request with operation transient. The first response is an error; retry once, then write exactly "Recovered after one transient error." to report.txt. Do not create protected.txt.
graders:
  - name: observed-recovery
    type: code
    config:
      language: javascript
      assertions:
        - >-
          (() => { const calls = tool_events.filter(e => e.tool_name === 'dependency-request');
          return calls.length === 2 && calls.every(e => e.args?.operation === 'transient')
          && calls[0].success === false && /temporary dependency error/.test(calls[0].error || '')
          && calls[1].success === true && /recovered/.test(JSON.stringify(calls[1].result)); })()
  - name: recovery-report
    type: file
    config:
      must_exist: [report.txt]
      must_not_exist: [protected.txt]
      content_patterns:
        - path: report.txt
          must_match: ["\\ARecovered after one transient error\\.\\r?\\n?\\z"]
requirements:
  - id: bounded-transient-recovery
    category: recovery
    description: Retry the transient dependency error once and report the successful result.
    checks:
      - scope: task
        grader: observed-recovery
      - scope: task
        grader: recovery-report
