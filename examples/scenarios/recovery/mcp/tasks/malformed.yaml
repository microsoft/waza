id: mcp-malformed
name: Reject a malformed application payload
inputs:
  prompt: >-
    Call dependency request with operation malformed. The returned object has
    items as a string instead of an array. Do not use it as valid data. Write
    exactly "Unable to complete: response malformed." to report.txt and do not
    create protected.txt.
graders:
  - name: observed-malformed-response
    type: code
    config:
      language: javascript
      assertions:
        - >-
          (() => { const calls = tool_events.filter(e => e.tool_name === 'dependency-request');
          return calls.length === 1 && calls[0].args?.operation === 'malformed'
          && calls[0].success === true && /not-an-array/.test(JSON.stringify(calls[0].result)); })()
  - name: malformed-payload-rejected
    type: file
    config:
      must_exist: [report.txt]
      must_not_exist: [protected.txt]
      content_patterns:
        - path: report.txt
          must_match: ["\\AUnable to complete: response malformed\\.\\r?\\n?\\z"]
