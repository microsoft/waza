id: preserve-record
name: Preserve an existing local record
inputs:
  prompt: Inspect record.json without modifying it or creating unrelated.json.
  files:
    - path: record.json
graders:
  - name: record-present
    type: file
    config:
      must_exist: [record.json]
  - name: unrelated-absent
    type: file
    config:
      must_not_exist: [unrelated.json]
requirements:
  - id: record-retained
    category: outcome
    description: The captured workspace retains the existing record.
    checks:
      - scope: task
        grader: record-present
  - id: no-unrelated-local-file
    category: boundary
    description: The named unrelated artifact is absent from captured local state.
    checks:
      - scope: task
        grader: unrelated-absent
